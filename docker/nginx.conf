server {
    listen 8080;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Hashed files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The app shell and its service worker must revalidate.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    # A self-hosted copy has no analytics.
    location = /a/boot.js {
        default_type text/javascript;
        return 200 "/* analytics off */\n";
    }
}
