server {
    listen 8080;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml font/ttf application/manifest+json;
    gzip_min_length 1024;

    # Hashed files never change.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /corpus/ {
        add_header Cache-Control "public, max-age=86400";
    }
    # The app shell and its service worker must revalidate.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # A psalm page for crawlers (psalm/023.html, from scripts/seo.mjs), or else the app, index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }
    # A self-hosted copy has no analytics.
    location = /a/boot.js {
        default_type text/javascript;
        return 200 "/* analytics off */\n";
    }
}
