name: Deploy to Cloudflare Pages

# Production: after the Website workflow passes on main, deploy the exact
# dist artifact it built. Nothing is rebuilt here.
on:
  workflow_run:
    workflows: [Website]
    branches: [main]
    types: [completed]

concurrency:
  group: precentor-pages-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

env:
  PROJECT: precentor

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.project.outputs.url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: repo

      - name: Check the token, and make the Pages project if it is missing
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./repo/.github/scripts/pages-project.sh "$PROJECT" >> "$GITHUB_OUTPUT"

      # Wrangler takes Pages Functions from ./functions (the analytics proxy).
      - name: Add the Pages Functions
        run: cp -r repo/functions functions

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ env.PROJECT }}
            --branch=main
            --commit-hash=${{ github.event.workflow_run.head_sha }}

      # The app, the index, a psalm, a tune and the analytics route must all answer.
      - name: Check the live site
        env:
          URL: ${{ steps.project.outputs.url }}
        run: |
          check() {
            for _ in $(seq 1 20); do
              if curl --fail --silent --show-error "$URL$1" | grep -q "$2"; then
                echo "ok  $1"
                return 0
              fi
              sleep 3
            done
            echo "FAIL $1 (expected \"$2\")" >&2
            return 1
          }
          check / 'Psalter'
          check /corpus/index.json '"psalms"'
          check /corpus/settings/023.json 'psalm-023'
          check /corpus/tunes/crimond.json 'Crimond'
          check /a/boot.js 'analytics off\|data-website-id'
